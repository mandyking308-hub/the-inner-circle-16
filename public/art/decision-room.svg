<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
<title id="title">Life Decision Room execution board</title><desc id="desc">Original editorial illustration of four execution lanes labelled decide, expert, execute and evidence connected to a central family decision.</desc>
<rect width="1200" height="900" fill="#efe7db"/>
<rect x="70" y="70" width="1060" height="760" fill="#faf6ef" stroke="#29241f" stroke-width="3"/>
<g transform="translate(120 140)"><rect width="960" height="135" fill="#24211d"/><text x="35" y="44" font-family="Arial, sans-serif" font-size="13" letter-spacing="3" fill="#b57a4f">LIFE DECISION ROOM</text><text x="35" y="88" font-family="Georgia, serif" font-size="35" fill="#f0e7da">One problem. Four lanes. A definition of done.</text><circle cx="900" cy="67" r="31" fill="#b57a4f"/><path d="M885 67h30M900 52v30" stroke="#24211d" stroke-width="4"/></g>
<g transform="translate(120 320)" font-family="Arial, sans-serif"><g><rect width="220" height="390" fill="#f4ece0" stroke="#29241f" stroke-width="2"/><text x="24" y="38" font-size="13" letter-spacing="3" fill="#9d6640">01 DECIDE</text></g><g transform="translate(245 0)"><rect width="220" height="390" fill="#eadcc9" stroke="#29241f" stroke-width="2"/><text x="24" y="38" font-size="13" letter-spacing="3" fill="#9d6640">02 EXPERT</text></g><g transform="translate(490 0)"><rect width="220" height="390" fill="#f4ece0" stroke="#29241f" stroke-width="2"/><text x="24" y="38" font-size="13" letter-spacing="3" fill="#9d6640">03 EXECUTE</text></g><g transform="translate(735 0)"><rect width="225" height="390" fill="#eadcc9" stroke="#29241f" stroke-width="2"/><text x="24" y="38" font-size="13" letter-spacing="3" fill="#9d6640">04 EVIDENCE</text></g></g>
<g fill="#29241f" font-family="Georgia, serif" font-size="22"><text x="145" y="405">What are we</text><text x="145" y="434">actually choosing?</text><text x="390" y="405">Where must a</text><text x="390" y="434">specialist advise?</text><text x="635" y="405">Who owns the</text><text x="635" y="434">next action?</text><text x="880" y="405">What proves the</text><text x="880" y="434">work is complete?</text></g>
<g stroke="#9d6640" stroke-width="4" fill="none"><path d="M150 500h150M395 500h150M640 500h150M885 500h150"/><path d="M150 550h110M395 550h150M640 550h95M885 550h130"/><path d="M150 600h145M395 600h105M640 600h150M885 600h90"/></g>
<g fill="#b57a4f"><circle cx="315" cy="500" r="10"/><circle cx="560" cy="550" r="10"/><circle cx="805" cy="600" r="10"/><circle cx="1045" cy="500" r="10"/></g>
<path d="M120 770h960" stroke="#9d6640" stroke-width="2" stroke-dasharray="12 12"/><text x="600" y="805" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" letter-spacing="3" fill="#655c53">PEERS FOR JUDGEMENT · PROFESSIONALS FOR ADVICE · CONCIERGE FOR EXECUTION</text>
</svg>